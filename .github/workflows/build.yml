name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests
        run: dotnet test tests/Rozkladka.Core.Tests -c Release
      - name: Publish single exe
        run: dotnet publish src/Rozkladka -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          & $iscc "/DAppVersion=$version" installer\Rozkladka.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Rozkladka-Setup
          path: publish/Rozkladka-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Rozkladka-portable-win-x64
          path: publish/Rozkladka.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Rozkladka-Setup.exe
            publish/Rozkladka.exe
